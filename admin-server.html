<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪器主板数据管理界面（服务器版）</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        h1::before {
            content: "🔐 ";
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .server-info {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 12px 20px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #2e7d32;
        }

        .tips {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
        }

        .upload-section {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .file-info {
            margin-top: 15px;
            color: #28a745;
            font-weight: 500;
        }

        .data-status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-item {
            background: #f5f5f5;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-item.ready {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-item.pending {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-icon {
            font-size: 18px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }

        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .save-btn {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
        }

        .clear-btn {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>仪器主板数据管理界面</h1>
            <div class="subtitle">服务器版 - 所有用户共享数据</div>

            <div class="server-info">
                <strong>🖥️ 服务器模式</strong> - 数据保存在服务器上，所有用户都可以访问
            </div>

            <div class="tips">
                <strong>📋 管理员操作说明：</strong><br>
                1. 上传"生产和出货信息追溯"Excel文件（包含仪器序列号和主板物料号）<br>
                2. 上传"主板型号和软件匹配关系"Excel文件（包含物料号、型号和软件版本）<br>
                3. 点击"保存数据到服务器"按钮<br>
                4. 所有用户都可以通过查询界面访问这些数据
            </div>

            <div class="data-status" id="dataStatus">
                <div class="status-item pending" id="mainDataStatus">
                    <span class="status-icon">⏳</span>
                    <span>主数据：未加载</span>
                </div>
                <div class="status-item pending" id="mappingDataStatus">
                    <span class="status-icon">⏳</span>
                    <span>匹配数据：未加载</span>
                </div>
            </div>

            <div id="messageArea"></div>

            <div class="upload-section">
                <input type="file" id="mainDataFile" accept=".xlsx,.xls,.csv">
                <button class="upload-btn" onclick="document.getElementById('mainDataFile').click()">
                    📁 上传仪器数据文件
                </button>
                <div class="file-info" id="mainFileInfo"></div>
            </div>

            <div class="upload-section">
                <input type="file" id="mappingDataFile" accept=".xlsx,.xls,.csv">
                <button class="upload-btn" onclick="document.getElementById('mappingDataFile').click()">
                    📁 上传软件匹配关系文件
                </button>
                <div class="file-info" id="mappingFileInfo"></div>
            </div>

            <div class="action-buttons">
                <button class="action-btn save-btn" id="saveBtn" onclick="saveData()" disabled>
                    💾 保存数据到服务器
                </button>
                <button class="action-btn clear-btn" onclick="clearData()">
                    🗑️ 清除服务器数据
                </button>
            </div>
        </div>
    </div>

    <script>
        // API 基础地址 - 配置你的 Vercel 域名
        // 本地开发使用：http://localhost:3000
        // Vercel 部署使用：https://instrument-checker-server.vercel.app
        const API_BASE = 'https://instrument-checker-server.vercel.app';
        
        // 解决跨域问题：使用 no-cors 模式（仅用于简单请求）
        // 注意：这可能会限制某些功能
        
        // 数据状态
        let isMainDataLoaded = false;
        let isMappingDataLoaded = false;

        // 页面加载时检查服务器数据状态
        window.onload = function() {
            checkServerStatus();
        };

        // 检查服务器数据状态
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const data = await response.json();
                
                if (data.isDataLoaded) {
                    isMainDataLoaded = true;
                    isMappingDataLoaded = true;
                    document.getElementById('mainFileInfo').textContent = `✓ 服务器已存储 (${data.mainDataCount}条记录)`;
                    document.getElementById('mappingFileInfo').textContent = `✓ 服务器已存储 (${data.mappingDataCount}条记录)`;
                }
                
                updateDataStatus();
            } catch (error) {
                showMessage('无法连接到服务器，请确保服务器已启动', 'error');
            }
        }

        // 更新数据状态显示
        function updateDataStatus() {
            const mainStatus = document.getElementById('mainDataStatus');
            const mappingStatus = document.getElementById('mappingDataStatus');
            const saveBtn = document.getElementById('saveBtn');

            if (isMainDataLoaded) {
                mainStatus.className = 'status-item ready';
                mainStatus.innerHTML = '<span class="status-icon">✅</span><span>主数据：已就绪</span>';
            } else {
                mainStatus.className = 'status-item pending';
                mainStatus.innerHTML = '<span class="status-icon">⏳</span><span>主数据：等待上传</span>';
            }

            if (isMappingDataLoaded) {
                mappingStatus.className = 'status-item ready';
                mappingStatus.innerHTML = '<span class="status-icon">✅</span><span>匹配数据：已就绪</span>';
            } else {
                mappingStatus.className = 'status-item pending';
                mappingStatus.innerHTML = '<span class="status-icon">⏳</span><span>匹配数据：等待上传</span>';
            }

            saveBtn.disabled = !(isMainDataLoaded && isMappingDataLoaded);
        }

        // 显示消息
        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            const div = document.createElement('div');
            div.className = type === 'error' ? 'error-msg' : 'success-msg';
            div.textContent = message;
            messageArea.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 5000);
        }

        // 处理主数据文件上传
        document.getElementById('mainDataFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('mainFileInfo').innerHTML = '<div class="loading"></div> 正在上传...';
            
            console.log('准备上传文件:', file.name);
            console.log('API地址:', `${API_BASE}/api/upload/main`);

            const formData = new FormData();
            formData.append('file', file);

            try {
                console.log('开始发送请求...');
                const response = await fetch(`${API_BASE}/api/upload/main`, {
                    method: 'POST',
                    body: formData,
                    mode: 'cors'
                });
                
                console.log('收到响应:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('响应数据:', data);

                if (data.success) {
                    isMainDataLoaded = true;
                    document.getElementById('mainFileInfo').textContent = `✓ 已上传: ${file.name} (${data.compressedCount}条记录)`;
                    updateDataStatus();
                    showMessage('主数据上传成功！', 'success');
                } else {
                    throw new Error(data.error || '未知错误');
                }
            } catch (error) {
                console.error('上传错误:', error);
                showMessage('上传失败: ' + error.message + ' (请检查控制台)', 'error');
                document.getElementById('mainFileInfo').textContent = '';
            }
        });

        // 处理匹配数据文件上传
        document.getElementById('mappingDataFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('mappingFileInfo').innerHTML = '<div class="loading"></div> 正在上传...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/api/upload/mapping`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    isMappingDataLoaded = true;
                    document.getElementById('mappingFileInfo').textContent = `✓ 已上传: ${file.name} (${data.compressedCount}条记录)`;
                    updateDataStatus();
                    showMessage('匹配数据上传成功！', 'success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showMessage('上传失败: ' + error.message, 'error');
                document.getElementById('mappingFileInfo').textContent = '';
            }
        });

        // 保存数据到服务器
        async function saveData() {
            if (!isMainDataLoaded || !isMappingDataLoaded) {
                showMessage('请先上传两个数据文件', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`数据已成功保存到服务器！(${data.mainDataCount}条仪器数据, ${data.mappingDataCount}条匹配数据)`, 'success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showMessage('保存失败: ' + error.message, 'error');
            }
        }

        // 清除服务器数据
        async function clearData() {
            if (!confirm('确定要清除服务器上的所有数据吗？此操作不可恢复。')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/clear`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    isMainDataLoaded = false;
                    isMappingDataLoaded = false;
                    document.getElementById('mainFileInfo').textContent = '';
                    document.getElementById('mappingFileInfo').textContent = '';
                    updateDataStatus();
                    showMessage('服务器数据已清除', 'success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showMessage('清除失败: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
